services:
  _defaults:
    autowire: true

  wudo_license.signer:
    class: Drupal\wudo_license\LicenseSigner
  Drupal\wudo_license\LicenseSigner: '@wudo_license.signer'

  wudo_license.activator:
    class: Drupal\wudo_license\Activator
  Drupal\wudo_license\Activator: '@wudo_license.activator'

  wudo_license.access:
    class: Drupal\wudo_license\DownloadAccess
    arguments:
      $codes: '@keyvalue.expirable'
  Drupal\wudo_license\DownloadAccess: '@wudo_license.access'

  wudo_license.paddle:
    class: Drupal\wudo_license\Paddle\PaddleClient
  Drupal\wudo_license\Paddle\PaddleClient: '@wudo_license.paddle'

  wudo_license.paddle_webhook:
    class: Drupal\wudo_license\Paddle\PaddleWebhook
  Drupal\wudo_license\Paddle\PaddleWebhook: '@wudo_license.paddle_webhook'
